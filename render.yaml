services:
  - type: web
    name: bikefriends-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_NAME
        value: bikefriends
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
